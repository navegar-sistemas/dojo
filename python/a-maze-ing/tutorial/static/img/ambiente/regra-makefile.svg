<text x="360" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="normal" fill="#6b7280" text-anchor="middle" dominant-baseline="central">make lint executa os dois comandos; se um falha, o make para ali</text>
