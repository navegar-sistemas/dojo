<text x="330" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#16a34a" text-anchor="middle">25.0 &lt; 0? não</text>
<rect x="470" y="54" width="260" height="40" rx="8" fill="#eff6ff" stroke="#16a34a" stroke-width="2"/>
<text x="600" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#16a34a" text-anchor="middle">_height: 15.0 → 25.0</text>
<text x="600" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">devolve True</text>
