<text x="250" y="270" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="normal" fill="#dc2626" text-anchor="start">e o setter imprime &quot;Rose: Error, height can&#x27;t be negative&quot;</text>
<text x="30" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="normal" fill="#6b7280" text-anchor="start">antes das duas chamadas, a rosa tem _height = 15.0</text>
