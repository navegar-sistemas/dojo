<rect x="250" y="174" width="160" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="330" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#dc2626" text-anchor="middle">-5.0 &lt; 0? sim</text>
<rect x="470" y="174" width="260" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="normal" fill="#dc2626" text-anchor="middle">_height continua 25.0</text>
<text x="600" y="236" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">devolve False</text>
